<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>緊急地震速報モニタ</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
  #map { position: absolute; inset: 0; background: #0b0e14; }  /* 海 */
  /* 自前UIのみ border-box (Leaflet 内部には触れない) */
  #panel, #panel *, #legend, #legend *, #clock, #clock *, #tsunami-banner { box-sizing: border-box; }
  /* 情報パネル */
  #panel {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(20, 22, 28, 0.92); color: #eee;
    border-radius: 10px; padding: 14px 18px; min-width: 300px; max-width: 380px;
    box-shadow: 0 4px 16px rgba(0,0,0,.5); border: 1px solid #333;
  }
  #panel.warn { border: 2px solid #ff3b30; animation: flash 1s infinite; }
  @keyframes flash { 50% { box-shadow: 0 0 24px rgba(255,59,48,.8); } }
  #title { font-size: 17px; font-weight: bold; margin: 6px 0; }
  #title .warn-label { color: #fff; background: #d70015; padding: 1px 8px; border-radius: 4px; }
  #title .forecast-label { color: #111; background: #ffcc00; padding: 1px 8px; border-radius: 4px; }
  #detail { font-size: 13px; line-height: 1.6; color: #b8bcc4; }
  /* 自分事判定 (最重要表示) */
  #verdict { display: none; margin-top: 10px; padding: 10px 8px; border-radius: 8px;
             text-align: center; font-weight: bold; font-size: 21px; }
  #verdict.hit { background: #d70015; color: #fff; }
  #verdict.miss { background: #2c2e33; color: #9aa0a6; font-size: 15px; }
  #countdown-box { display: none; text-align: center; margin-top: 10px; padding: 12px 8px;
                   background: rgba(0,0,0,.4); border-radius: 8px; }
  .cd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: end; }
  .cd-label { font-size: 13px; color: #8a8f98; }
  #home-int-big { font-size: 52px; font-weight: bold; color: #ffb340; line-height: 1.1; }
  #countdown { font-size: 52px; font-weight: bold; color: #ffd60a; line-height: 1.1;
               font-variant-numeric: tabular-nums; }
  #countdown.arrived { color: #ff453a; font-size: 34px; }
  #home-int { font-size: 12px; color: #8a8f98; margin-top: 6px; }
  #areas { display: none; }
  #gm-note { font-size: 13px; color: #ffd60a; margin-top: 6px; display: none; }
  .note { font-size: 12px; color: #8a8f98; margin-top: 8px; }  /* AA 4.5:1 以上 */
  .epi-icon { color: #ff3b30; font-size: 30px; font-weight: bold; text-shadow: 0 0 6px #000;
              line-height: 30px; text-align: center; }
  .gm-icon { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,204,0,.85);
             border: 2px solid #ff9500; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.6); opacity: .5; } }
  /* 津波警報バナー */
  #tsunami-banner {
    display: none;
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1100; min-width: 340px; max-width: 60%;
    border-radius: 10px; padding: 10px 20px; text-align: center;
    font-weight: bold; box-shadow: 0 4px 20px rgba(0,0,0,.6);
    animation: flash 1s infinite;
  }
  #tsunami-banner { cursor: pointer; }
  #tsunami-banner .head { font-size: 22px; }
  #tsunami-banner .areas { font-size: 13px; font-weight: normal; margin-top: 4px; }
  /* 津波バナー表示中はパネル・時計を下げて重なりを防ぐ (警報文を隠さない) */
  body.has-tsunami #panel, body.has-tsunami #clock { top: 100px; }
  @media (max-width: 1100px) {
    #tsunami-banner { left: 0; right: 0; transform: none;
                      max-width: none; min-width: 0; border-radius: 0; }
  }
  /* 現在時刻 (日本標準時) */
  #clock {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(20, 22, 28, 0.92); color: #eee; text-align: center;
    border-radius: 10px; padding: 8px 16px; border: 1px solid #333;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #clock-time { font-size: 28px; font-weight: bold; font-variant-numeric: tabular-nums;
                letter-spacing: 1px; line-height: 1.2; }
  /* 接続状態ランプ: 緑=受信中, 赤=切断 */
  #conn-dot { display: inline-block; width: 13px; height: 13px; border-radius: 50%;
              margin-right: 10px; vertical-align: middle; background: #ff453a; }
  #conn-dot.ok { background: #34c759; }
  #clock-date { font-size: 12px; color: #8a8f98; }
  #clock-src  { font-size: 11px; color: #8a8f98; }
  #clock-src.err { color: #ff453a; font-weight: bold; }
  /* 観測震度の凡例 */
  #legend {
    position: absolute; bottom: 24px; left: 12px; z-index: 1000;
    background: rgba(20, 22, 28, 0.92); color: #eee;
    border-radius: 12px; padding: 14px 18px; border: 1px solid #333;
    font-size: 16px; font-weight: bold;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #legend .row { display: flex; align-items: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  #legend .chip { width: 52px; height: 34px; border-radius: 6px; text-align: center;
                  line-height: 34px; font-weight: bold; font-size: 17px; }
  #legend .chip.wide { width: auto; padding: 0 12px; }
  #legend .symbols { font-size: 12px; font-weight: normal; color: #b8bcc4; margin-top: 8px; }
  /* スマホ幅: 全要素をビューポート内に収める (時計の下にパネルを積む) */
  @media (max-width: 600px) {
    #clock { padding: 6px 10px; }
    #clock-time { font-size: 20px; }
    #panel { top: 68px; left: 8px; right: 8px; min-width: 0; max-width: none; }
    #legend { left: 8px; max-width: calc(100% - 16px); padding: 10px 12px; font-size: 14px; }
    #legend .chip { width: 38px; height: 28px; line-height: 28px; font-size: 13px; }
    body.has-tsunami #clock { top: 110px; }
    body.has-tsunami #panel { top: 166px; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="tsunami-banner"></div>
<div id="clock">
  <div id="clock-time"><span id="conn-dot"></span><span id="clock-time-text">--:--:--</span></div>
  <div id="clock-date"></div>
  <div id="clock-src">日本標準時 (NICT同期)</div>
</div>
<div id="legend">
  <span id="legend-title">観測震度 (強震モニタ)</span>
  <div class="row" id="legend-row"></div>
</div>
<div id="panel">
  <div id="title">待機中</div>
  <div id="detail">緊急地震速報を受信するとここに表示されます。</div>
  <div id="verdict"></div>
  <div id="countdown-box">
    <div class="cd-grid">
      <div>
        <div class="cd-label">この場所の予想震度</div>
        <div id="home-int-big">-</div>
      </div>
      <div>
        <div class="cd-label">強い揺れまで(秒)</div>
        <div id="countdown">--</div>
      </div>
    </div>
    <div id="home-int"></div>
  </div>
  <div id="areas"></div>
  <div id="gm-note"></div>
  <div class="note">地図を右クリック(長押し)で自宅位置を設定できます。<br>
    予想震度は安全側 (やや大きめ) に出る傾向があります。到達時刻は±数秒の目安。<br>
    防災行動は気象庁の公式情報に従ってください。</div>
</div>
<script src="ws_port.js"></script>
<script src="vendor/leaflet.js"></script>
<script>
"use strict";
const VS = 3.5, VP = 7.0; // km/s

const map = L.map("map", { zoomControl: false }).setView([36.2, 138.2], 5);
L.control.zoom({ position: "bottomright" }).addTo(map);
// ベースマップ: タイル不使用。都道府県ポリゴンのみの自前描画 (オフラインでも動く)
// 暗い海 + 濃灰の陸 + 細い県境 — 震度の色と円が最も際立つ
// 専用の下層ペインに置き、観測震度・円・マーカーより必ず下に描画する
map.createPane("basemap").style.zIndex = 150;
let japanGeo = null;  // 津波モードの県別色分けにも使う
fetch("data/japan.geojson")
  .then(r => r.json())
  .then(gj => {
    japanGeo = gj;
    L.geoJSON(gj, {
      pane: "basemap",
      style: {
        color: "#4a515c",      // 県境
        weight: 1,
        fillColor: "#1a1e24",  // 陸
        fillOpacity: 1,
      },
      interactive: false,
    }).addTo(map);
  })
  .catch(() => {});
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution("地図データ: dataofjapan/land");
L.Icon.Default.prototype.options.imagePath = "vendor/images/";

// P/S波円は Canvas レンダラーで毎フレーム更新しても滑らかに描く
const waveRenderer = L.canvas({ padding: 1.0 });
// 観測震度は別キャンバスに分離 (円アニメーションのたびに全点再描画させない)
const gridRenderer = L.canvas({ padding: 0.5 });

// ---- 観測震度の配色 (ユーザー指定) ----
// [しきい値(リアルタイム震度), 塗り色, 文字色, ラベル]
const INT_SCALE = [
  [6.5, "#FF00FF", "#fff", "7"],    // 震度7: マゼンタ
  [6.0, "#8B0000", "#fff", "6強"],  // 6強: ダークレッド
  [5.5, "#FF2800", "#fff", "6弱"],  // 6弱: 赤
  [5.0, "#FF9900", "#111", "5強"],  // 5強: オレンジ
  [4.5, "#F6D500", "#111", "5弱"],  // 5弱: 黄
  [3.5, "#66CCFF", "#111", "4"],    // 4: 水色
  [2.5, "#0066CC", "#fff", "3"],    // 3: 青
  [1.5, "#00897B", "#fff", "2"],    // 2: 青緑
  [0.5, "#A0A0A0", "#111", "1"],    // 1: 灰色
];                                  // 0: 表示なし
function intColor(v) {
  for (const [min, color] of INT_SCALE) if (v >= min) return color;
  return null;
}
// 凡例: 通常=観測震度 / 津波モード=津波予報の段階
function renderLegend(mode) {
  const row = document.getElementById("legend-row");
  const title = document.getElementById("legend-title");
  row.innerHTML = "";
  const add = (color, text, label, wide) => {
    const chip = document.createElement("div");
    chip.className = wide ? "chip wide" : "chip";
    chip.style.background = color;
    chip.style.color = text;
    chip.textContent = label;
    row.appendChild(chip);
  };
  const old = document.getElementById("legend-symbols");
  if (old) old.remove();
  if (mode === "tsunami") {
    title.textContent = "津波予報";
    add("#F6D500", "#111", "津波注意報", true);
    add("#E60012", "#fff", "津波警報", true);
    add("#FF00FF", "#fff", "大津波警報", true);
  } else {
    title.textContent = "観測震度 (強震モニタ)";
    [...INT_SCALE].reverse().forEach(([, color, text, label]) =>
      add(color, text, label, false));
    // 地図上の記号は凡例で必ず説明する (初見者が3秒で読めるように)
    const sym = document.createElement("div");
    sym.className = "symbols";
    sym.id = "legend-symbols";
    sym.textContent = "✕ 震央 / 青破線 P波 / 赤円 S波(強い揺れの範囲)";
    row.parentElement.appendChild(sym);
  }
}
renderLegend("intensity");
const intensityLayer = L.layerGroup().addTo(map);
let pendingGrid = null;   // 津波モード中に受けた最新フレーム (復帰時に描く)
function onIntensityGrid(msg) {
  if (tsunamiMode) { pendingGrid = msg; return; }  // 非表示レイヤーへの毎秒生成を避ける
  intensityLayer.clearLayers();
  // 弱い震度から描き、強い揺れの点が必ず上に来るようにする
  const pts = [...(msg.points || [])].sort((a, b) => a[2] - b[2]);
  for (const [lat, lon, v] of pts) {
    const color = intColor(v);
    if (!color) continue;
    L.circleMarker([lat, lon], {
      renderer: gridRenderer, radius: v >= 4.5 ? 7 : 5,  // 震度5弱以上は大きく
      color: "#222", weight: 1, fillColor: color, fillOpacity: 0.9,
    }).addTo(intensityLayer);
  }
}

const $ = id => document.getElementById(id);
let home = null, homeMarker = null, gmMarker = null;
let sock = null;                 // WebSocket (自宅設定の送信用)
let homeSetByUser = false;       // 設定直後はビューを動かさない
let clockOffset = 0;             // serverNow - Date.now() (PC時計ズレ補正)
let disconnectedAt = null;       // 切断時刻 (古い表示の自動クリア用)
const warnedEvents = new Set(); // 前面誘導 (通知/点滅/音) はイベントごとに1回
let animTimer = null;

// 複数地震の同時進行に対応: event_id ごとに状態とレイヤーを持つ
// ev = { msg, epiMarker, pCircle, sCircle, serverRemaining, fitted }
const events = new Map();
let selectedId = null;           // パネルに表示中のイベント (最も切迫したもの)

const nowMs = () => Date.now() + clockOffset;

// ---- 現在時刻 (日本標準時) — サーバの NICT 補正済み時刻に追従 ----
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
function renderClock() {
  // JST (UTC+9) を明示的に組み立てる (クライアントのタイムゾーンに依存しない)
  const d = new Date(nowMs() + 9 * 3600 * 1000);
  const p2 = n => String(n).padStart(2, "0");
  document.getElementById("clock-time-text").textContent =
    `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`;
  document.getElementById("clock-date").textContent =
    `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())} (${WEEKDAYS[d.getUTCDay()]})`;
}
setInterval(renderClock, 200);
renderClock();

function noteServerNow(msg) {
  if (msg.server_now) {
    const off = new Date(msg.server_now).getTime() - Date.now();
    if (Number.isFinite(off)) clockOffset = off;
  }
}

// ---- 前面誘導 (警報時にタブが背面でも気づけるように) ----
if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}
let titleFlashTimer = null;
function alertAttention(msg) {
  // ブラウザ通知 (クリックでこのタブへ)
  if ("Notification" in window && Notification.permission === "granted"
      && (document.hidden || !document.hasFocus())) {
    const n = new Notification("緊急地震速報(警報)", {
      body: `${msg.hypocenter || ""} 最大震度${msg.max_intensity || "不明"} — クリックで地図を表示`,
      tag: "eew-warn", renotify: true,
    });
    n.onclick = () => { window.focus(); n.close(); };
  }
  // タブタイトル点滅
  if (!titleFlashTimer) {
    let flip = false;
    titleFlashTimer = setInterval(() => {
      document.title = (flip = !flip) ? "【緊急地震速報】" : "緊急地震速報モニタ";
    }, 800);
    setTimeout(stopTitleFlash, 120000);
  }
  // 音はデスクトップ側 (カスタム音源) が担当。ここでは鳴らさない (二重再生防止)
}
function stopTitleFlash() {
  if (titleFlashTimer) { clearInterval(titleFlashTimer); titleFlashTimer = null; }
  document.title = "緊急地震速報モニタ";
}

// ---- 自宅設定 (右クリック) ----
map.on("contextmenu", e => {
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  const { lat, lng } = e.latlng;
  if (!confirm(`この地点を自宅に設定しますか?\n(${lat.toFixed(4)}, ${lng.toFixed(4)})`)) return;
  homeSetByUser = true;
  sock.send(JSON.stringify({ type: "set_home", latitude: lat, longitude: lng }));
});

function setStatus(ok) {
  // ランプの色だけに頼らず文字でも状態を出す (色覚多様性・小ささ対策)
  $("conn-dot").classList.toggle("ok", !!ok);
  disconnectedAt = ok ? null : (disconnectedAt || Date.now());
  const src = $("clock-src");
  src.textContent = ok ? "日本標準時 (NICT同期)" : "切断 - 再接続中...";
  src.classList.toggle("err", !ok);
}

function dropEvent(id) {
  const ev = events.get(id);
  if (ev) {
    [ev.epiMarker, ev.pCircle, ev.sCircle].forEach(l => l && map.removeLayer(l));
    events.delete(id);
  }
  if (selectedId === id) selectedId = null;
  if (events.size === 0) {
    if (animTimer) { cancelAnimationFrame(animTimer); animTimer = null; }
    stopTitleFlash();
  }
}

function sRemainingOf(ev) {
  if (ev.msg.home && ev.msg.home.s_arrival) {
    return (new Date(ev.msg.home.s_arrival).getTime() - nowMs()) / 1000;
  }
  if (ev.serverRemaining) {
    return ev.serverRemaining.value - (Date.now() - ev.serverRemaining.at) / 1000;
  }
  return null;
}

// パネルに出すイベントを選ぶ: S波が未到達で最も早く来るもの > 最新の地震
function selectEvent() {
  let approaching = null, aR = Infinity, newest = null, nT = -Infinity;
  for (const [id, ev] of events) {
    const r = sRemainingOf(ev);
    if (r !== null && r > 0 && r < aR) { aR = r; approaching = id; }
    const t = ev.msg.origin_time ? new Date(ev.msg.origin_time).getTime() : 0;
    if (t > nT) { nT = t; newest = id; }
  }
  selectedId = approaching || newest;
  return selectedId;
}

function onInit(msg) {
  home = msg.home;
  if (home && home.latitude != null) {
    if (homeMarker) map.removeLayer(homeMarker);
    homeMarker = L.marker([home.latitude, home.longitude], { title: home.name })
      .addTo(map).bindPopup(home.name || "自宅");
    if (!homeSetByUser && events.size === 0) {
      map.setView([home.latitude, home.longitude], 9);
    }
    homeSetByUser = false;
  }
}

// ---- P/S波円: 全イベント分を rAF+時計補正で滑らかに拡大 ----
function animateWaves() {
  const step = () => {
    animTimer = requestAnimationFrame(step);
    if (tsunamiMode) return;  // 津波モード中は円を描かない
    for (const ev of events.values()) {
      const m = ev.msg;
      if (!m.origin_time || m.latitude == null) continue;
      const elapsed = (nowMs() - new Date(m.origin_time).getTime()) / 1000;
      if (elapsed <= 0 || elapsed > 900) continue;
      const rp = VP * elapsed * 1000, rs = VS * elapsed * 1000; // m
      const ll = [m.latitude, m.longitude];
      if (!ev.pCircle) {
        ev.pCircle = L.circle(ll, { renderer: waveRenderer, radius: rp, color: "#4da6ff",
                                    weight: 1.5, fill: false, dashArray: "4 4" }).addTo(map);
        ev.sCircle = L.circle(ll, { renderer: waveRenderer, radius: rs, color: "#ff453a",
                                    weight: 2.5, fillColor: "#ff453a", fillOpacity: 0.12 }).addTo(map);
      } else {
        ev.pCircle.setRadius(rp); ev.sCircle.setRadius(rs);
        const c = ev.pCircle.getLatLng();
        if (Math.abs(c.lat - ll[0]) > 1e-6 || Math.abs(c.lng - ll[1]) > 1e-6) {
          ev.pCircle.setLatLng(ll); ev.sCircle.setLatLng(ll);
        }
      }
    }
  };
  if (!animTimer) step();
}

// ---- パネル描画: 最も切迫したイベントを表示 ----
function renderPanel() {
  const id = selectEvent();
  if (!id) {
    $("title").textContent = "待機中";
    $("detail").textContent = disconnectedAt
      ? "サーバとの接続が切れています。再接続を試行中..."
      : "緊急地震速報を受信するとここに表示されます。";
    $("verdict").style.display = "none";
    $("countdown-box").style.display = "none";
    $("countdown").textContent = "--";
    $("home-int-big").textContent = "-";
    $("panel").classList.remove("warn");
    return;
  }
  const msg = events.get(id).msg;
  const kind = msg.is_warn
    ? '<span class="warn-label">警報</span>' : '<span class="forecast-label">予報</span>';
  $("panel").classList.toggle("warn", !!msg.is_warn);
  $("title").innerHTML = `緊急地震速報 ${kind} 第${msg.serial}報${msg.is_final ? "(最終)" : ""}`;
  // 詳細は1行に圧縮 (緊急時に読むものではない)
  const parts = [];
  if (msg.hypocenter) parts.push(msg.hypocenter);
  if (msg.is_assumption) {
    parts.push("震源仮定(PLUM)");  // M・深さはダミー値なので出さない
  } else {
    if (msg.magnitude != null) parts.push(`M${msg.magnitude.toFixed(1)}`);
    if (msg.depth_km != null) parts.push(`深さ${msg.depth_km}km`);
  }
  if (msg.max_intensity) parts.push(`最大震度${msg.max_intensity}`);
  $("detail").textContent = parts.join(" / ");

  // 自分事判定 (最重要): 警報対象地域に自分がいるか
  const v = $("verdict");
  if (msg.in_warn_area === true) {
    v.className = "hit";
    v.textContent = `${msg.home_pref || "この地域"}は警報対象です`;
    v.style.display = "block";
  } else if (msg.in_warn_area === false) {
    v.className = "miss";
    v.textContent = `${msg.home_pref || "この地域"}は警報対象外 (他地域に警報)`;
    v.style.display = "block";
  } else {
    v.style.display = "none";
  }

  if (msg.home && msg.home.intensity_label) {
    $("countdown-box").style.display = "block";
    $("home-int-big").textContent = msg.home.intensity_label;
    $("home-int").textContent =
      `${msg.hypocenter || ""} / 震央距離${msg.home.epicentral_km}km / 暫定値・±数秒の目安`;
  } else {
    // 選択イベントの切替時に、別の地震の予想震度を残留させない
    $("home-int-big").textContent = "-";
    $("home-int").textContent = "";
    if (!events.get(id).serverRemaining) $("countdown-box").style.display = "none";
  }
}

function onEEW(msg) {
  noteServerNow(msg);
  if (msg.is_cancel) {
    dropEvent(msg.event_id);
    renderPanel();
    return;
  }
  let ev = events.get(msg.event_id);
  const isNewEvent = !ev;
  if (!ev) {
    ev = { msg, epiMarker: null, pCircle: null, sCircle: null,
           serverRemaining: null };
    events.set(msg.event_id, ev);
  }
  ev.msg = msg;

  if (msg.is_warn && !warnedEvents.has(msg.event_id)) {
    warnedEvents.add(msg.event_id);
    alertAttention(msg);
  }

  if (msg.latitude != null && msg.longitude != null) {
    const ll = [msg.latitude, msg.longitude];
    if (!ev.epiMarker) {
      ev.epiMarker = L.marker(ll, {
        icon: L.divIcon({ className: "epi-icon", html: "✕", iconSize: [30, 30] })
      }).addTo(map);
    } else {
      ev.epiMarker.setLatLng(ll);
    }
    autoFit(isNewEvent);  // 新イベント時は強制フィット、続報は必要時のみ
    animateWaves();
  }
  renderPanel();
}

// ---- 縮尺の自動調整 ----
// 自宅 + 全震央 + 拡大中のS波円が常に画面に収まるよう自動フィット。
// ユーザーが手動で地図を操作した直後 20 秒間は自動調整しない。
let lastUserInteract = 0;
let autoFitting = false;
map.on("zoomstart dragstart", () => {
  if (!autoFitting) lastUserInteract = Date.now();
});

function autoFit(force = false) {
  if (tsunamiMode) return;  // 津波モード中は津波地図の縮尺を維持
  if (events.size === 0) return;
  if (!force && Date.now() - lastUserInteract < 20000) return;
  const pts = [];
  for (const ev of events.values()) {
    const m = ev.msg;
    if (m.latitude == null) continue;
    pts.push([m.latitude, m.longitude]);
    // S波が自宅に未到達の間はその円全体も収める (到達後は追わない)
    const r = sRemainingOf(ev);
    if (ev.sCircle && r !== null && r > 0) {
      const b = ev.sCircle.getBounds();
      pts.push([b.getNorth(), b.getEast()], [b.getSouth(), b.getWest()]);
    }
  }
  if (home && home.latitude != null) pts.push([home.latitude, home.longitude]);
  if (pts.length === 0) return;
  const target = L.latLngBounds(pts).pad(0.1);
  if (force || !map.getBounds().contains(target)) {
    autoFitting = true;
    map.fitBounds(target);
    // アニメーション完了で解除 (固定600msだとアニメ中のユーザー操作を取りこぼす)
    map.once("moveend", () => { autoFitting = false; });
    setTimeout(() => { autoFitting = false; }, 2000);  // moveend が来ない場合の保険
  }
}
setInterval(autoFit, 2000);

// ---- カウントダウン: ローカルで毎 200ms 自走 + 期限切れイベント整理 ----
function tick() {
  // 切断が30秒続いたら表示を全クリア (再接続すればサーバから最新が再送される)
  if (disconnectedAt && Date.now() - disconnectedAt > 30000) {
    lastTsunami = null;
    if (tsunamiMode) exitTsunamiMode();
    $("tsunami-banner").style.display = "none";
    document.body.classList.remove("has-tsunami");
    // 観測震度・揺れ検知も「現在の状態」ではないので消す
    intensityLayer.clearLayers();
    pendingGrid = null;
    if (gmMarker) { map.removeLayer(gmMarker); gmMarker = null; }
    $("gm-note").style.display = "none";
    if (events.size > 0) {
      for (const id of [...events.keys()]) dropEvent(id);
      renderPanel();
    }
  }
  for (const [id, ev] of [...events]) {
    const t = ev.msg.origin_time ? new Date(ev.msg.origin_time).getTime() : null;
    const r = sRemainingOf(ev);
    if ((t !== null && nowMs() - t > 900000) || (r !== null && r < -180)) {
      dropEvent(id);
      renderPanel();
    }
  }
  const prev = selectedId;
  const id = selectEvent();
  if (id !== prev) renderPanel();  // 切迫イベントの入れ替わりでパネル更新
  if (!id) return;
  const remaining = sRemainingOf(events.get(id));
  if (remaining === null) return;
  const box = $("countdown-box"), cd = $("countdown");
  box.style.display = "block";
  if (remaining > 0) {
    cd.classList.remove("arrived");
    cd.textContent = Math.ceil(remaining);
  } else {
    cd.classList.add("arrived");
    cd.textContent = "到達";
  }
}
setInterval(tick, 200);

function onCountdown(msg) {
  noteServerNow(msg);
  const ev = events.get(msg.event_id);
  if (!ev) return;
  ev.serverRemaining = { value: msg.s_remaining, at: Date.now() };
}

// ---- 津波警報バナー / 津波モード ----
// バナー配色: 大津波警報=紫, 津波警報=赤, 津波注意報=黄
const TSUNAMI_STYLE = {
  "大津波警報": { bg: "#B000B0", fg: "#fff" },
  "津波警報":   { bg: "#D70015", fg: "#fff" },
  "津波注意報": { bg: "#F6D500", fg: "#111" },
};
// 津波モードの沿岸配色: 注意報=黄, 警報=赤, 大津波警報=マゼンタ (震度7と同格)
const TSUNAMI_COAST_COLOR = {
  "津波注意報": "#F6D500",
  "津波警報":   "#E60012",
  "大津波警報": "#FF00FF",
};
let lastTsunami = null;    // 直近の津波ペイロード
let tsunamiMode = false;   // 津波専用地図の表示中か
let tsunamiLayer = null;

// 気象庁の津波予報区 (沿岸線データ)。予報区名で正確に一致させる
let tsunamiGeo = null;
fetch("data/tsunami_areas.geojson")
  .then(r => r.json())
  .then(gj => { tsunamiGeo = gj; })
  .catch(() => {});

function buildTsunamiLayer() {
  if (!tsunamiGeo || !lastTsunami) return null;
  const layer = L.layerGroup();
  // 低い警報から描き、高い警報の線が上に来るようにする
  for (const grade of ["津波注意報", "津波警報", "大津波警報"]) {
    const areas = lastTsunami.grades[grade] || [];
    if (!areas.length) continue;
    const feats = tsunamiGeo.features.filter(ft => {
      const n = ft.properties.name || "";
      // 発表名は気象庁の予報区名そのもの (完全一致優先、次いで部分一致)
      return areas.some(a => n === a || n.includes(a) || a.includes(n));
    });
    if (!feats.length) continue;
    L.geoJSON({ type: "FeatureCollection", features: feats }, {
      style: { color: TSUNAMI_COAST_COLOR[grade], weight: 6,
               opacity: 0.95, lineCap: "round" },
      interactive: false,
    }).addTo(layer);
  }
  return layer;
}

function setEventLayersVisible(visible) {
  for (const ev of events.values()) {
    if (!visible) {
      [ev.epiMarker, ev.pCircle, ev.sCircle].forEach(l => l && map.removeLayer(l));
      ev.epiMarker = ev.pCircle = ev.sCircle = null;  // 再表示時に描き直される
    } else if (ev.msg.latitude != null && !ev.epiMarker) {
      ev.epiMarker = L.marker([ev.msg.latitude, ev.msg.longitude], {
        icon: L.divIcon({ className: "epi-icon", html: "✕", iconSize: [30, 30] })
      }).addTo(map);
    }
  }
}

function enterTsunamiMode() {
  const layer = buildTsunamiLayer();
  if (!layer) return;
  tsunamiMode = true;
  tsunamiLayer = layer.addTo(map);
  map.removeLayer(intensityLayer);   // 観測震度を隠す
  setEventLayersVisible(false);      // 円・震央を隠す
  renderLegend("tsunami");           // 凡例も津波モードへ
  // 対象予報区が全て入る縮尺へ
  const bounds = L.latLngBounds([]);
  layer.eachLayer(g => g.getBounds && bounds.extend(g.getBounds()));
  if (bounds.isValid()) map.fitBounds(bounds.pad(0.1));
  renderTsunamiBanner();
}

function exitTsunamiMode() {
  tsunamiMode = false;
  if (tsunamiLayer) { map.removeLayer(tsunamiLayer); tsunamiLayer = null; }
  intensityLayer.addTo(map);
  if (pendingGrid) { const g = pendingGrid; pendingGrid = null; onIntensityGrid(g); }
  setEventLayersVisible(true);
  renderLegend("intensity");         // 凡例を観測震度に戻す
  autoFit(true);
  renderTsunamiBanner();
}

document.getElementById("tsunami-banner").addEventListener("click", () => {
  if (tsunamiMode) exitTsunamiMode();
  else enterTsunamiMode();
});

function onTsunami(msg) {
  const b = $("tsunami-banner");
  if (msg.cancelled || !msg.grades || !Object.keys(msg.grades).length) {
    lastTsunami = null;
    if (tsunamiMode) exitTsunamiMode();
    b.style.display = "none";
    document.body.classList.remove("has-tsunami");
    return;
  }
  lastTsunami = msg;
  if (tsunamiMode) {   // 表示中に内容が更新されたら描き直す
    map.removeLayer(tsunamiLayer);
    tsunamiLayer = buildTsunamiLayer();
    if (tsunamiLayer) tsunamiLayer.addTo(map);
  }
  renderTsunamiBanner();
}

function renderTsunamiBanner() {
  const msg = lastTsunami;
  const b = $("tsunami-banner");
  document.body.classList.toggle("has-tsunami", !!msg);  // パネル・時計を下げる
  if (!msg) { b.style.display = "none"; return; }
  const hint = tsunamiMode
    ? '<div style="font-size:12px;margin-top:3px">クリックで通常表示に戻る</div>'
    : '<div style="font-size:12px;margin-top:3px">クリックで津波地図を表示</div>';
  if (msg.home_grade) {
    // 自分の地域が対象: 最大級の表示 + 行動指示のみ (段階で文言を変える)
    const st = TSUNAMI_STYLE[msg.home_grade] || TSUNAMI_STYLE["津波警報"];
    const action = msg.home_grade === "津波注意報"
      ? "海岸や川から離れてください"
      : "ただちに海岸・川から離れて高台へ";
    b.style.background = st.bg;
    b.style.color = st.fg;
    b.style.animation = tsunamiMode ? "none" : "flash 1s infinite";
    b.innerHTML = `<div class="head">この地域に${msg.home_grade}</div>`
      + `<div class="areas" style="font-size:16px;font-weight:bold">`
      + action + `</div>` + hint;
  } else {
    // 対象外: 控えめな一行のみ (緊急表示を邪魔しない)
    b.style.background = "rgba(44,46,51,.95)";
    b.style.color = "#9aa0a6";
    b.style.animation = "none";
    const order = ["大津波警報", "津波警報", "津波注意報"];
    const top = order.find(g => msg.grades[g]);
    b.innerHTML = `<div style="font-size:14px">${top} 発表中 (この地域は対象外)</div>` + hint;
  }
  b.style.display = "block";
}

function onGroundMotion(msg) {
  $("gm-note").style.display = "block";
  $("gm-note").textContent =
    `揺れ検知(強震モニタ): ${msg.region}付近 震度${msg.intensity}相当 (${msg.point_count}点)`;
  if (msg.latitude != null) {
    if (gmMarker) map.removeLayer(gmMarker);
    gmMarker = L.marker([msg.latitude, msg.longitude], {
      icon: L.divIcon({ className: "gm-icon", iconSize: [18, 18] })
    }).addTo(map).bindPopup(`揺れ検知: ${msg.region}付近`);
  }
  setTimeout(() => { $("gm-note").style.display = "none";
                     if (gmMarker) { map.removeLayer(gmMarker); gmMarker = null; } }, 120000);
}

// タブの表示状態 (前面/背面) をサーバへ報告する。
// 「見えているタブが無ければ警報時に新しいタブを開く」判定に使われる。
function sendVisibility() {
  if (sock && sock.readyState === WebSocket.OPEN) {
    sock.send(JSON.stringify({ type: "visibility",
                               visible: document.visibilityState === "visible" }));
  }
}
document.addEventListener("visibilitychange", sendVisibility);

function connect() {
  const ws = new WebSocket(`ws://127.0.0.1:${window.WS_PORT || (Number(location.port) + 1)}`);
  sock = ws;
  ws.onopen = () => { setStatus(true); sendVisibility(); };
  ws.onclose = () => { setStatus(false); setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "init") { noteServerNow(msg); onInit(msg); }
    else if (msg.type === "eew") onEEW(msg);
    else if (msg.type === "countdown") onCountdown(msg);
    else if (msg.type === "ground_motion") onGroundMotion(msg);
    else if (msg.type === "intensity_grid") onIntensityGrid(msg);
    else if (msg.type === "tsunami") onTsunami(msg);
    else if (msg.type === "time") noteServerNow(msg);
  };
}
connect();
</script>
</body>
</html>
